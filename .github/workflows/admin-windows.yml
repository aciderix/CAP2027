name: Admin Windows build

on:
  push:
    paths:
      - "admin/**"
      - ".github/workflows/admin-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: |
            admin/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('admin/src-tauri/Cargo.toml') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build Vite frontend
        run: npm run build

      - name: Build Tauri (Windows .exe + installers)
        run: npx tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: cap2027-admin-windows-${{ github.sha }}
          path: |
            admin/src-tauri/target/release/bundle/msi/*.msi
            admin/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable .exe
        uses: actions/upload-artifact@v4
        with:
          name: cap2027-admin-windows-portable-${{ github.sha }}
          path: admin/src-tauri/target/release/cap2027-admin*.exe
          if-no-files-found: warn
