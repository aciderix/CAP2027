name: Android package (signed APK + AAB)

# Déclenchement MANUEL uniquement (jamais sur push) — pour ne pas
# consommer de minutes GitHub Actions à chaque commit. Produit en une
# seule passe un APK release signé (installable directement / sideload)
# ET un Android App Bundle signé (à uploader sur la Play Console).
#
# Secrets repository requis (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    keystore .jks encodé en base64
#   ANDROID_KEYSTORE_PASSWORD  mot de passe du keystore
#   ANDROID_KEY_ALIAS          alias de la clé dans le keystore
#   ANDROID_KEY_PASSWORD       mot de passe de cet alias
# (Mêmes secrets que android-release.yml — voir docs/RELEASE.md.)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version affichée aux utilisateurs (ex: 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Version code (entier, doit strictement augmenter entre releases)"
        required: true
        default: "1"

permissions:
  contents: read

concurrency:
  group: android-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app (Vite)
        env:
          # Clé publishable Supabase — destinée au client; la RLS protège les données.
          VITE_SUPABASE_URL: https://oyvqvfawcxlnvpgloicx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_nycw__S1NdZYIVyu4LH4SQ_830IdXPA
        run: npm run build

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p android/app
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          # Sanity check: keystore valide ? (le mot de passe passe par une
          # variable d'environnement, jamais en clair, pour ne pas fuiter.)
          keytool -list -keystore android/app/release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            > /dev/null

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build signed APK + AAB
        working-directory: android
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Une seule invocation Gradle pour les deux artefacts (partage la
        # compilation → plus rapide que deux jobs séparés).
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Locate artifacts
        id: artifacts
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$APK_PATH" ]; then echo "::error::No APK produced"; exit 1; fi
          if [ -z "$AAB_PATH" ]; then echo "::error::No AAB produced"; exit 1; fi
          echo "Found APK: $APK_PATH"
          echo "Found AAB: $AAB_PATH"
          echo "apk=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: cap2027-apk-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: ${{ steps.artifacts.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: cap2027-aab-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: ${{ steps.artifacts.outputs.aab }}
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/release.jks
