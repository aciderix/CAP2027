name: Android package (signed APK + AAB)

# Produit en une seule passe un APK release signé (installable directement
# / sideload, pour TESTER avant publication) ET un Android App Bundle signé
# (à uploader sur la Play Console).
#
# Les deux artefacts sont publiés dans une GitHub Release (et non en
# artifacts Actions) car le quota de stockage des artifacts est plein.
#
# Versionnage :
#   - versionCode : si non fourni, calculé automatiquement = nombre de
#     minutes écoulées depuis 2020-01-01 (UTC). Strictement croissant à
#     chaque build, bien au-dessus des petits codes manuels déjà utilisés,
#     et sous le plafond Play (2 100 000 000). Garantit "code > version en
#     ligne" sans intervention.
#   - versionName : si non fourni, "1.1.0".
#   On peut toujours forcer des valeurs via "Run workflow" (inputs).
#
# Secrets repository requis (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    keystore .jks encodé en base64
#   ANDROID_KEYSTORE_PASSWORD  mot de passe du keystore
#   ANDROID_KEY_ALIAS          alias de la clé dans le keystore
#   ANDROID_KEY_PASSWORD       mot de passe de cet alias
# (voir docs/RELEASE.md.)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version affichée (laisser vide = 1.1.0)"
        required: false
        default: ""
      version_code:
        description: "Version code entier (laisser vide = auto, minutes depuis 2020)"
        required: false
        default: ""
  # Déclencheur temporaire limité à la branche de dev pour produire un
  # build de test signé. À retirer après le test.
  push:
    branches:
      - claude/blissful-cori-88ld94

permissions:
  contents: write

concurrency:
  group: android-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VN="${{ github.event.inputs.version_name }}"
          VC="${{ github.event.inputs.version_code }}"
          if [ -z "$VC" ]; then VC=$(( ( $(date -u +%s) - 1577836800 ) / 60 )); fi
          if [ -z "$VN" ]; then VN="1.1.0"; fi
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$VN versionCode=$VC"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app (Vite)
        env:
          # Clé publishable Supabase — destinée au client; la RLS protège les données.
          VITE_SUPABASE_URL: https://oyvqvfawcxlnvpgloicx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_nycw__S1NdZYIVyu4LH4SQ_830IdXPA
        run: npm run build

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p android/app
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          # Sanity check: keystore valide ? (le mot de passe passe par une
          # variable d'environnement, jamais en clair, pour ne pas fuiter.)
          keytool -list -keystore android/app/release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            > /dev/null

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build signed APK + AAB
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Une seule invocation Gradle pour les deux artefacts (partage la
        # compilation → plus rapide que deux jobs séparés).
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Locate & rename artifacts
        id: artifacts
        run: |
          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_SRC=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$APK_SRC" ]; then echo "::error::No APK produced"; exit 1; fi
          if [ -z "$AAB_SRC" ]; then echo "::error::No AAB produced"; exit 1; fi
          VN="${{ steps.ver.outputs.version_name }}"
          VC="${{ steps.ver.outputs.version_code }}"
          APK="cap2027-${VN}-${VC}.apk"
          AAB="cap2027-${VN}-${VC}.aab"
          cp "$APK_SRC" "$APK"
          cp "$AAB_SRC" "$AAB"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_SRC -> $APK"
          echo "Found AAB: $AAB_SRC -> $AAB"

      # Publié dans une GitHub Release (et non un artifact) : les assets de
      # release ne consomment pas le quota de stockage des artifacts Actions.
      - name: Publish APK + AAB to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VN="${{ steps.ver.outputs.version_name }}"
          VC="${{ steps.ver.outputs.version_code }}"
          TAG="release-${VN}-${VC}"
          gh release create "$TAG" \
            "${{ steps.artifacts.outputs.apk }}" \
            "${{ steps.artifacts.outputs.aab }}" \
            --target "${{ github.sha }}" \
            --title "Release ${VN} (code ${VC})" \
            --notes "Build release SIGNÉ depuis \`${{ github.ref_name }}\` (${{ github.sha }}).

          - **APK** : installable directement pour TESTER (sideload).
          - **AAB** : à uploader sur la Play Console (versionCode ${VC}, versionName ${VN}).

          versionCode auto = minutes depuis 2020-01-01 (strictement croissant, > codes déjà en ligne)."
          echo "Release publiée : $TAG"

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/release.jks
