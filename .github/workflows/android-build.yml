name: Android build (debug APK)

# Déclenchement MANUEL uniquement (workflow_dispatch). L'auto-build sur
# push/PR a été retiré pour ne pas consommer de minutes GitHub Actions à
# chaque commit. Pratique pour un APK debug rapide (aucun secret requis).
# Pour un APK + AAB signés, voir android-package.yml.
on:
  workflow_dispatch:
  # Déclencheur temporaire (test unification catégories) limité à la branche.
  # À retirer après le test.
  push:
    branches:
      - claude/blissful-cori-88ld94

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app (Vite)
        env:
          # Supabase publishable key — designed to be embedded client-side; RLS guards the data.
          VITE_SUPABASE_URL: https://oyvqvfawcxlnvpgloicx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_nycw__S1NdZYIVyu4LH4SQ_830IdXPA
        run: npm run build

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      # Publié dans une GitHub Release (et non un artifact) : les assets de
      # release ne consomment pas le quota de stockage des artifacts Actions.
      # Pratique quand ce quota est plein. Tag unique par run.
      - name: Publish debug APK to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="debug-${{ github.run_number }}-${SHORT_SHA}"
          # Renomme l'APK pour un nom de fichier explicite côté téléchargement.
          DEST="cap2027-debug-${TAG}.apk"
          cp "${{ steps.apk.outputs.path }}" "$DEST"
          gh release create "$TAG" "$DEST" \
            --target "${{ github.sha }}" \
            --title "Debug APK ${TAG}" \
            --notes "Build debug automatique depuis \`${{ github.ref_name }}\` (${{ github.sha }}). APK installable pour test (non signé pour le Play Store)."
          echo "Release publiée : $TAG"
