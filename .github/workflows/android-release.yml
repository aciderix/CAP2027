name: Android release (signed AAB)

# Manual-only. Produces a signed Android App Bundle ready to upload to
# the Play Console. Versioning is provided at trigger time so we don't
# accidentally publish two different builds with the same versionCode.
#
# Required GitHub repository secrets (Settings → Secrets and variables
# → Actions → New repository secret):
#   ANDROID_KEYSTORE_BASE64    base64-encoded .jks keystore
#   ANDROID_KEYSTORE_PASSWORD  password for the keystore
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       password for that alias
#
# See docs/RELEASE.md for the one-time keystore generation procedure.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown to users (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Version code (integer, must strictly increase between releases)"
        required: true
        default: "1"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app (Vite)
        env:
          VITE_SUPABASE_URL: https://oyvqvfawcxlnvpgloicx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_nycw__S1NdZYIVyu4LH4SQ_830IdXPA
        run: npm run build

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p android/app
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          # Sanity: confirm it's a valid keystore (will fail loudly otherwise).
          # Password is passed via env (not ${{ }} interpolation) so it never
          # appears in the process list or risks leaking into logs.
          keytool -list -keystore android/app/release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            > /dev/null

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build signed AAB
        working-directory: android
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Locate AAB
        id: aab
        run: |
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            echo "::error::No AAB produced"
            exit 1
          fi
          echo "Found AAB: $AAB_PATH"
          echo "path=$AAB_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: cap2027-release-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/release.jks
