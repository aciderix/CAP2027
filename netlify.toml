# Netlify config for the PUBLIC CAP 2027 web app (cap2027.fr).
# This builds the root project (the same web app shipped as the Android
# APK). The admin console is a SEPARATE Netlify site that builds the
# admin/ directory — see admin/netlify.toml. Set that site's "Base
# directory" to `admin` in the Netlify UI so it picks up its own config.

[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — the app uses internal state-based navigation, no router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the immutable hashed assets emitted by Vite, but never
# cache the HTML shell so users always get the latest manifest.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
