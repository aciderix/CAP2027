# Netlify config for the CAP 2027 admin console.
# The mobile app (root project) is published as an Android APK via
# GitHub Actions and is NOT deployed here. Only /admin is web-hosted.

[build]
  base = "admin"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — the admin uses internal state-based navigation, no
# router. Any deep link must serve index.html so the React app can
# decide what to render.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the immutable hashed assets emitted by Vite, but never
# cache the HTML shell so users always get the latest manifest.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
